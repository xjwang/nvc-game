<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非暴力沟通大挑战 🎮</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #ff8fab;
    --coral: #ffb3ba;
    --peach: #ffdac1;
    --mint: #b5ead7;
    --lavender: #c7ceea;
    --sky: #a2d2ff;
    --yellow: #fdfd96;
    --nvc-green: #7ec8a0;
    --nvc-dark: #4a7868;
    --violent-red: #e8738a;
    --violent-dark: #5c2d3a;
    --card-bg: rgba(255,255,255,0.92);
    --shadow: 0 8px 32px rgba(0,0,0,0.06);
    --text: #4a4458;
    --text-light: #7a7288;
  }

  body {
    font-family: 'Nunito', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    transition: background 0.6s ease;
    line-height: 1.65;
    overflow-x: hidden;
  }
  body.home-bg {
    background: linear-gradient(135deg, #fce4ec 0%, #f8e8f0 25%, #e8f0f8 50%, #f0f8e8 75%, #fff8e8 100%);
  }
  body.game-nvc {
    background: linear-gradient(135deg, #e8f8e8, #d8f0d8, #e0f0e0, #e8f4e0);
  }
  body.game-violent {
    background: linear-gradient(135deg, #2a1a22, #1a1016, #20141c, #2a1822);
  }

  .container { max-width: 640px; width: 100%; min-height: 500px; }

  /* ===== Floating decorations ===== */
  .float-deco {
    position: fixed; pointer-events: none; z-index: 0;
    font-size: 2rem; opacity: 0.1;
  }

  /* ===== Cards ===== */
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 36px 30px 30px;
    box-shadow: var(--shadow);
    border: 2px solid rgba(200,180,200,0.1);
    position: relative;
    z-index: 1;
  }

  /* ===== HOME PAGE ===== */
  .home-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .home-mascot {
    font-size: 4.5rem;
    display: inline-block;
    animation: bounce 2s ease infinite;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    20% { transform: translateY(-18px); }
    40% { transform: translateY(0); }
    60% { transform: translateY(-8px); }
    80% { transform: translateY(0); }
  }
  .home-title {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, #ff8fab, #a2d2ff, #b5ead7, #fdfd96);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rainbowText 4s ease infinite;
    margin: 8px 0;
  }
  @keyframes rainbowText {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .home-sub {
    font-size: 0.92rem;
    color: var(--text-light);
    line-height: 1.7;
  }
  .mode-btns {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .mode-btn {
    padding: 18px 20px;
    border-radius: 20px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: inherit;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .mode-btn .btn-emoji { font-size: 2rem; display: block; margin-bottom: 4px; }
  .mode-btn .btn-tag { font-size: 0.78rem; font-weight: 600; opacity: 0.75; margin-top: 4px; display: block; }
  .mode-btn.nvc {
    background: linear-gradient(135deg, #e0f8e0, #c8f0d0);
    color: var(--nvc-dark);
    border-color: var(--nvc-green);
  }
  .mode-btn.nvc:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 12px 40px rgba(120,180,140,0.3);
    animation: wiggle 0.4s ease;
  }
  .mode-btn.violent {
    background: linear-gradient(135deg, #4a2d3a, #5c3a48);
    color: #f0d8e0;
    border-color: var(--violent-red);
  }
  .mode-btn.violent:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 12px 40px rgba(220,100,130,0.4);
    animation: wiggle 0.4s ease;
  }
  @keyframes wiggle {
    0%,100% { transform: translateY(-4px) scale(1.02) rotate(0); }
    25% { transform: translateY(-4px) scale(1.02) rotate(-1.5deg); }
    75% { transform: translateY(-4px) scale(1.02) rotate(1.5deg); }
  }

  /* ===== GAME PAGE ===== */
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .mode-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    border-radius: 30px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    animation: pulse 2s ease infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  .mode-chip.nvc { background: #d8f0d8; color: var(--nvc-dark); }
  .mode-chip.violent { background: #5c2d3a; color: #f0c8d8; }
  .score-badge {
    font-size: 0.9rem;
    font-weight: 700;
  }
  .score-badge .score-num {
    font-size: 1.3rem;
    display: inline-block;
    animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes popIn {
    from { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.2); }
    to { transform: scale(1); opacity: 1; }
  }
  .score-badge.nvc .score-num { color: var(--nvc-green); }
  .score-badge.violent .score-num { color: var(--violent-red); }

  /* Hearts progress */
  .hearts-progress {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    justify-content: center;
  }
  .heart-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
  }
  .heart-dot.done.nvc { background: var(--nvc-green); color: white; animation: popIn 0.4s ease; }
  .heart-dot.done.violent { background: var(--violent-red); color: white; animation: popIn 0.4s ease; }
  .heart-dot.current.nvc { background: var(--nvc-green); color: white; transform: scale(1.2); box-shadow: 0 0 12px rgba(120,200,150,0.5); animation: pulse 1s ease infinite; }
  .heart-dot.current.violent { background: var(--violent-red); color: white; transform: scale(1.2); box-shadow: 0 0 12px rgba(220,100,130,0.5); animation: pulse 1s ease infinite; }
  .heart-dot.pending { background: #e8e0e8; }
  .game-violent .heart-dot.pending { background: #3a2835; }

  .scenario-chip {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 0.72rem;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .scenario-chip.nvc { background: #fef0d8; color: #9a7a50; }
  .scenario-chip.violent { background: #4a2d3a; color: #e0b0c0; }

  /* Scenario description */
  .scenario-desc {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.9;
    padding: 18px 22px;
    margin: 10px 0 6px;
    border-radius: 16px;
  }
  .scenario-desc.nvc { background: #fcfaf4; border-left: 4px solid var(--nvc-green); }
  .scenario-desc.violent { background: #2a1a24; border-left: 4px solid var(--violent-red); color: #d8c8d0; }
  .scenario-emotion-hint {
    font-size: 0.85rem;
    color: #9a8a78;
    font-style: italic;
    margin-bottom: 8px;
  }
  .game-violent .scenario-emotion-hint { color: #b098a0; }

  /* Flow diagram */
  .flow-diagram {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin: 14px 0 22px;
    flex-wrap: wrap;
  }
  .flow-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 64px;
  }
  .flow-dot {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 800;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }
  .flow-dot.done { color: white; }
  .flow-dot.done.nvc { background: var(--nvc-green); }
  .flow-dot.done.violent { background: var(--violent-red); }
  .flow-dot.active {
    color: white; transform: scale(1.18);
    box-shadow: 0 0 0 6px rgba(120,200,150,0.18);
    animation: flowPulse 1.4s ease infinite;
  }
  .flow-dot.active.nvc { background: var(--nvc-green); box-shadow: 0 0 0 6px rgba(120,200,150,0.18); }
  .flow-dot.active.violent { background: var(--violent-red); box-shadow: 0 0 0 6px rgba(220,100,130,0.18); }
  @keyframes flowPulse {
    0%,100% { box-shadow: 0 0 0 6px rgba(120,200,150,0.18); }
    50% { box-shadow: 0 0 0 14px rgba(120,200,150,0.05); }
  }
  .flow-dot.pending { background: #e8e0e8; color: #b8b0b8; }
  .game-violent .flow-dot.pending { background: #3a2835; color: #7a6878; }
  .flow-line {
    width: 36px; height: 3px;
    border-radius: 2px;
    transition: all 0.4s ease;
    flex-shrink: 0;
  }
  .flow-line.done.nvc { background: var(--nvc-green); }
  .flow-line.done.violent { background: var(--violent-red); }
  .flow-line.pending { background: #e0d8e0; }
  .game-violent .flow-line.pending { background: #3a2835; }
  .flow-label {
    font-size: 0.7rem; font-weight: 700; opacity: 0.6; letter-spacing: 0.04em;
    transition: all 0.3s;
  }
  .flow-node.active-node .flow-label { opacity: 1; }

  /* Share */
  .share-row {
    display: flex; justify-content: center; margin: 6px 0 14px;
  }
  .btn-share {
    padding: 10px 28px; border-radius: 30px;
    font-size: 0.88rem; font-weight: 800; cursor: pointer;
    border: 2.5px dashed #d0c0d0;
    background: #faf8fc;
    color: #8a7a90;
    transition: all 0.3s; font-family: inherit;
  }
  .btn-share:hover {
    border-color: #b090c0; color: #6a5080;
    transform: translateY(-2px); box-shadow: 0 4px 16px rgba(150,120,180,0.15);
  }
  #shareCanvas { display: none; }

  /* Smooth question transition */
  .question-area {
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .question-area.switching {
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
  }

  /* Navigation buttons */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    gap: 10px;
  }
  .btn-nav {
    padding: 8px 18px;
    border-radius: 22px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .btn-nav.prev {
    background: #f0e8f0;
    color: #6a5a7a;
  }
  .btn-nav.prev:hover { background: #e0d4e2; transform: translateX(-2px); }
  .btn-nav.next {
    background: var(--nvc-green);
    color: white;
  }
  .btn-nav.next:hover { background: var(--nvc-dark); transform: translateX(2px); }
  .btn-nav:disabled {
    opacity: 0.3;
    cursor: default;
    transform: none !important;
  }
  .game-violent .btn-nav.prev {
    background: #3a2835;
    color: #c8b8c8;
  }
  .game-violent .btn-nav.next {
    background: var(--violent-red);
  }
  .nav-scene-indicator {
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--text);
    white-space: nowrap;
  }
  .game-violent .nav-scene-indicator { color: #d8c8d0; }

  /* Result reveal */
  .reveal-hidden { display: none; }
  .btn-reveal {
    padding: 14px 42px;
    border-radius: 32px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    border: none;
    font-family: inherit;
    background: linear-gradient(135deg, #ff8fab, #ff7eb3);
    color: white;
    box-shadow: 0 6px 28px rgba(255,143,171,0.35);
    transition: all 0.3s;
    animation: pulseGlow 2s ease infinite;
  }
  @keyframes pulseGlow {
    0%,100% { box-shadow: 0 6px 28px rgba(255,143,171,0.35); }
    50% { box-shadow: 0 8px 40px rgba(255,143,171,0.55); }
  }
  .btn-reveal:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 36px rgba(255,143,171,0.5);
  }
  .reveal-anim {
    animation: revealIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .reveal-anim.d1 { animation-delay: 0s; }
  .reveal-anim.d2 { animation-delay: 0.1s; }
  .reveal-anim.d3 { animation-delay: 0.2s; }
  .reveal-anim.d4 { animation-delay: 0.3s; }
  .reveal-anim.d5 { animation-delay: 0.4s; }
  @keyframes revealIn {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .score-count-up {
    display: inline-block;
    animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .element-label {
    font-size: 0.9rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .element-label.nvc { color: var(--nvc-green); }
  .element-label.violent { color: var(--violent-red); }

  .question-box {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 18px;
    line-height: 1.9;
    padding: 18px 22px;
    border-radius: 16px;
  }
  .question-box.nvc { background: #f6fdf6; border: 2px dashed var(--nvc-green); }
  .question-box.violent {
    color: #e0d0d8;
    background: #2a1822;
    border: 2px dashed var(--violent-red);
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .opt-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 18px;
    border: 2.5px solid #e8e0e8;
    border-radius: 16px;
    background: #fefcfe;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text);
    text-align: left;
    line-height: 1.6;
    animation: slideUp 0.35s ease both;
  }
  .opt-btn:nth-child(1) { animation-delay: 0.12s; }
  .opt-btn:nth-child(2) { animation-delay: 0.17s; }
  .opt-btn:nth-child(3) { animation-delay: 0.22s; }
  .opt-btn:nth-child(4) { animation-delay: 0.27s; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .opt-btn:hover { transform: translateX(6px); border-color: #c0d0c0; background: #f8fcf8; }
  .game-violent .opt-btn:hover { transform: translateX(6px); border-color: #8a6070; }
  .game-violent .opt-btn {
    background: #2a1a24;
    border-color: #4a303d;
    color: #d8c8d0;
  }

  .opt-letter {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.82rem; font-weight: 900;
    flex-shrink: 0;
    border: 2.5px solid #d8d0d8;
    color: #a898a8;
    transition: all 0.25s;
  }
  .game-violent .opt-letter { border-color: #6a5060; color: #b098a8; }

  .opt-btn.selected { border-color: var(--nvc-green); background: #f0faf2; transform: scale(1.02); box-shadow: 0 4px 20px rgba(120,200,150,0.15); }
  .opt-btn.selected .opt-letter { border-color: var(--nvc-green); background: var(--nvc-green); color: white; animation: popIn 0.3s ease; }
  .game-violent .opt-btn.selected { border-color: var(--violent-red); background: #3a1a28; box-shadow: 0 4px 20px rgba(220,100,130,0.2); }
  .game-violent .opt-btn.selected .opt-letter { border-color: var(--violent-red); background: var(--violent-red); color: white; }

  .btn-row { display: flex; gap: 10px; justify-content: flex-end; }
  .btn {
    padding: 12px 28px; border-radius: 30px;
    font-size: 0.9rem; font-weight: 800;
    cursor: pointer; border: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: inherit; letter-spacing: 0.03em;
  }
  .btn-next { background: var(--nvc-green); color: white; }
  .btn-next:hover:not(:disabled) { transform: translateY(-3px) scale(1.04); box-shadow: 0 8px 24px rgba(120,200,150,0.35); }
  .btn-next:disabled { background: #d0c8d0; cursor: not-allowed; }
  .game-violent .btn-next { background: var(--violent-red); }
  .game-violent .btn-next:hover:not(:disabled) { box-shadow: 0 8px 24px rgba(220,100,130,0.4); }
  .game-violent .btn-next:disabled { background: #5a4048; }

  .btn-quit {
    background: transparent; color: var(--text-light);
    border: 2.5px solid #e0d8e0;
  }
  .btn-quit:hover { border-color: #c0b0c0; transform: translateY(-2px); }
  .game-violent .btn-quit { color: #b098a8; border-color: #5a4050; }
  .game-violent .btn-quit:hover { border-color: #9a7080; }

  /* ===== RESULT PAGE ===== */
  .result-wrap {
    text-align: center;
  }
  .result-emoji {
    font-size: 5rem;
    display: inline-block;
  }
  .result-title {
    font-size: 1.8rem; font-weight: 900; margin: 8px 0 4px;
  }
  .result-nickname {
    font-size: 1.1rem; font-weight: 700; opacity: 0.85;
    margin-bottom: 12px; font-style: italic;
  }
  .result-score-wrap {
    display: inline-block; cursor: pointer;
    padding: 8px 20px; border-radius: 30px;
    transition: all 0.3s;
    position: relative;
  }
  .result-score-wrap:hover { transform: scale(1.05); }
  .result-score-big {
    font-size: 4rem; font-weight: 900; line-height: 1;
    transition: all 0.3s;
  }
  .result-score-big.nvc { color: var(--nvc-green); }
  .result-score-big.violent { color: var(--violent-red); }
  .result-score-sub {
    font-size: 0.85rem; opacity: 0.7; font-weight: 600;
  }
  .result-score-hint {
    font-size: 0.72rem; opacity: 0.5; margin-top: 2px;
  }
  .result-msg {
    font-size: 0.9rem; line-height: 1.8;
    padding: 16px 18px; border-radius: 16px;
    margin: 18px 0; text-align: left;
  }
  .result-msg.nvc { background: #f6fdf6; color: #4a6a50; }
  .result-msg.violent { background: #2a1822; color: #d8c0c8; }

  /* Breakdown (hidden by default) */
  .breakdown-wrap {
    max-height: 0; overflow: hidden;
    transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), margin 0.3s;
    margin-top: 0;
  }
  .breakdown-wrap.open { max-height: 300px; margin-top: 14px; }
  .breakdown-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .break-item {
    padding: 10px 6px; border-radius: 12px;
    text-align: center; background: #f8f4f8;
  }
  .break-item .b-label { font-size: 0.7rem; font-weight: 700; opacity: 0.7; margin-bottom: 2px; }
  .break-item .b-score { font-size: 1.1rem; font-weight: 900; }
  .break-item .b-score.nvc-c { color: var(--nvc-green); }
  .break-item .b-score.v-c { color: var(--violent-red); }

  /* Three game buttons */
  .result-btns {
    display: flex; gap: 10px; justify-content: center;
    flex-wrap: wrap; margin-top: 20px;
  }
  .rbtn {
    flex: 1; min-width: 100px;
    padding: 14px 10px; border-radius: 18px;
    font-size: 0.82rem; font-weight: 800;
    cursor: pointer; border: 3px solid transparent;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: inherit; text-align: center;
    letter-spacing: 0.03em;
  }
  .rbtn .rbtn-emoji { font-size: 1.5rem; display: block; margin-bottom: 2px; }
  .rbtn-replay {
    background: linear-gradient(135deg, #ffe0e8, #ffd0d8);
    color: #8a3a50; border-color: #ffb0c0;
  }

// ============================================================
// GAME STATE
// ============================================================
let mode = null;           // 'nvc' | 'violent'
let currentScenarios = []; // 3 randomly selected scenarios
let currentScenarioIdx = 0; // 0,1,2 — which scenario page
let currentStepKey = 'observe'; // 'observe'|'feel'|'need'|'request' — which step is active
let autoAdvanceTimer = null; // cancelable auto-advance to next scenario
// answers: keyed by "scenarioId-elementKey" — { scenarioId, elementKey, optionIdx, score }
let answers = {};

// Step data
const ELEMENT_ORDER = ['observe','feel','need','request'];
const ELEMENT_NAMES = {observe:'观察', feel:'感受', need:'需要', request:'请求'};
const ELEMENT_ICONS = {observe:'👁️', feel:'💗', need:'🎯', request:'🤝'};

// ============================================================
// HELPERS
// ============================================================
function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function getScore(base) { return mode==='nvc'?base:3-base; }
function totalScore() { return Object.values(answers).reduce((s,a)=>s+(a.score||0),0); }
function answerKey(sid, ek) { return sid+'-'+ek; }
function getAnswer(sid, ek) { return answers[answerKey(sid,ek)]; }
function isStepDone(sid, ek) { return !!getAnswer(sid,ek); }
function allStepsDone(sid) { return ELEMENT_ORDER.every(k=>isStepDone(sid,k)); }
function elemScores() {
  const map = {observe:0,feel:0,need:0,request:0};
  Object.values(answers).forEach(a=>{if(map[a.elementKey]!==undefined)map[a.elementKey]+=a.score||0;});
  return map;
}

// ============================================================
// GAME SETUP
// ============================================================
function startGame(m) {
  mode = m;
  answers = {};
  currentScenarioIdx = 0;
  currentStepKey = 'observe';
  if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
  currentScenarios = shuffle(scenarioPool).slice(0,3);
  const bgClass = mode==='nvc'?'game-nvc':'game-violent';
  document.getElementById('body').className = bgClass;
  document.getElementById('app').className = mode==='violent'?'game-violent':'';
  renderScenarioPage();
}

// ============================================================
// RENDER SCENARIO PAGE (flow diagram + current question)
// ============================================================
function renderScenarioPage() {
  if (currentScenarioIdx >= currentScenarios.length) { renderResult(); return; }

  const s = currentScenarios[currentScenarioIdx];
  const cls = mode==='nvc'?'nvc':'violent';
  const score = totalScore();
  const maxScore = currentScenarios.length * ELEMENT_ORDER.length * 3;

  // Flow diagram — each dot/line gets an id for smooth DOM updates
  let flowHTML = '<div class="flow-diagram">';
  ELEMENT_ORDER.forEach((key, i) => {
    const done = isStepDone(s.id, key);
    const active = key === currentStepKey;
    let dotCls = done ? `done ${cls}` : (active ? `active ${cls}` : 'pending');
    let lineCls = '';
    if (i < 3) {
      const nextDone = isStepDone(s.id, ELEMENT_ORDER[i+1]);
      lineCls = nextDone ? `done ${cls}` : 'pending';
    }
    const nodeCls = active ? 'flow-node active-node' : 'flow-node';
    flowHTML += `<div class="${nodeCls}" id="flow-node-${key}">
      <div class="flow-dot ${dotCls}" id="flow-dot-${key}">${done?'✓':ELEMENT_ICONS[key]}</div>
      <span class="flow-label" id="flow-label-${key}">${ELEMENT_NAMES[key]}</span>
    </div>`;
    if (i < 3) flowHTML += `<div class="flow-line ${lineCls}" id="flow-line-${i}"></div>`;
  });
  flowHTML += '</div>';

  // Current question
  const elem = s[currentStepKey];
  const shuffledOpts = (function(){
    const key = '_opts_'+s.id+'_'+currentStepKey;
    if (!s[key]) s[key] = shuffle(elem.opts.map((o,i)=>({...o,origIdx:i})));
    return s[key];
  })();

  const letters = ['🐣','🐥','🐔','🦄'];
  let optsHTML = '';
  const curAns = getAnswer(s.id, currentStepKey);
  shuffledOpts.forEach((opt, i) => {
    const isSel = curAns && curAns.optionIdx === i;
    optsHTML += `<button class="opt-btn${isSel?' selected':''}" onclick="selectAnswer('${currentStepKey}',${i})" id="opt-${i}">
      <span class="opt-letter">${letters[i]}</span><span>${opt.t}</span></button>`;
  });

  // All steps done for this scenario?
  const scenarioDone = allStepsDone(s.id);

  const lastScenario = currentScenarioIdx === currentScenarios.length - 1;

  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="game-header">
        <span class="mode-chip ${cls}">${mode==='nvc'?'🌿 非暴力沟通挑战':'🔥 暴力沟通大挑战'}</span>
        <span class="score-badge ${cls}">得分 <span class="score-num" id="liveScore">${score}</span></span>
      </div>
      <span class="scenario-chip ${cls}">${s.tag} · 场景 ${currentScenarioIdx+1}/3</span>
      <div style="font-size:1.2rem;font-weight:800;color:var(--text);margin:4px 0;">${s.title}</div>
      <div class="scenario-desc ${cls}">${s.text||s.title}</div>
      ${s.emotion ? `<div class="scenario-emotion-hint">${s.emotion}</div>` : ''}
      ${flowHTML}
      <div id="qArea" class="question-area">
        <div class="element-label ${cls}" id="elLabel">${ELEMENT_NAMES[currentStepKey]}</div>
        <div class="question-box ${cls}" id="qBox">${elem.q}</div>
        <div class="options-list" id="optList">${optsHTML}</div>
      </div>
      <div class="nav-row">
        <button class="btn-nav prev" id="btnPrev" ${currentScenarioIdx===0?'disabled':''} onclick="prevScenario()">◀ 上一场景</button>
        <span class="nav-scene-indicator">${currentScenarioIdx+1} / ${currentScenarios.length}</span>
        <button class="btn-nav next" id="btnNext" ${!scenarioDone?'disabled':''} onclick="nextScenario()">${lastScenario?'🎉 揭晓结果':'下一场景 ▶'}</button>
      </div>
      <div style="text-align:center;margin-top:12px;">
        <button class="btn btn-quit" onclick="renderHome()">🏠 退出</button>
      </div>
    </div>`;
}

function selectAnswer(stepKey, optIdx) {
  const s = currentScenarios[currentScenarioIdx];
  const optsKey = '_opts_'+s.id+'_'+stepKey;
  const shuffledOpts = s[optsKey];
  const baseScore = shuffledOpts[optIdx].s;
  const finalScore = getScore(baseScore);

  answers[answerKey(s.id, stepKey)] = {
    scenarioId: s.id, elementKey: stepKey,
    optionIdx: optIdx, score: finalScore, baseScore
  };

  // Update option styling in-place (no full re-render)
  shuffledOpts.forEach((_,i)=>{
    const el = document.getElementById('opt-'+i);
    if(el) el.classList.toggle('selected', i===optIdx);
  });

  // Animate live score
  const sEl = document.getElementById('liveScore');
  if(sEl){sEl.textContent=totalScore();sEl.style.animation='none';sEl.offsetHeight;sEl.style.animation='popIn 0.3s cubic-bezier(0.16,1,0.3,1)';}

  // Update flow diagram immediately (dot turns green/red)
  updateFlowDiagram(s.id, stepKey);

  const curIdx = ELEMENT_ORDER.indexOf(stepKey);
  if (curIdx < 3) {
    // Advance to next step within same scenario — smooth fade transition
    currentStepKey = ELEMENT_ORDER[curIdx + 1];
    const qArea = document.getElementById('qArea');
    if (qArea) {
      qArea.classList.add('switching');
      setTimeout(() => {
        refreshQuestionContent();
        qArea.classList.remove('switching');
      }, 200);
    } else {
      renderScenarioPage();
    }
  } else {
    // Last step (request) done → enable nav, auto-advance or wait for click
    updateNavButtons(s.id);
    if (currentScenarioIdx < currentScenarios.length - 1) {
      if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
      autoAdvanceTimer = setTimeout(() => { autoAdvanceTimer = null; nextScenario(); }, 650);
    }
  }
}

function prevScenario() {
  if (currentScenarioIdx <= 0) return;
  if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
  currentScenarioIdx--;
  currentStepKey = 'observe';
  renderScenarioPage();
  window.scrollTo({top:0, behavior:'smooth'});
}

function nextScenario() {
  if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
  currentScenarioIdx++;
  currentStepKey = 'observe';
  if (currentScenarioIdx >= currentScenarios.length) renderResult();
  else { renderScenarioPage(); window.scrollTo({top:0,behavior:'smooth'}); }
}

function updateFlowDiagram(sid, activeKey) {
  const cls = mode==='nvc'?'nvc':'violent';
  ELEMENT_ORDER.forEach((key, i) => {
    const done = isStepDone(sid, key);
    const active = key === activeKey;
    const dotEl = document.getElementById('flow-dot-'+key);
    const nodeEl = document.getElementById('flow-node-'+key);
    if (dotEl) {
      dotEl.className = 'flow-dot ' + (done ? `done ${cls}` : (active ? `active ${cls}` : 'pending'));
      dotEl.textContent = done ? '✓' : ELEMENT_ICONS[key];
    }
    if (nodeEl) {
      nodeEl.className = active ? 'flow-node active-node' : 'flow-node';
    }
    if (i < 3) {
      const lineEl = document.getElementById('flow-line-'+i);
      if (lineEl) {
        const nextDone = isStepDone(sid, ELEMENT_ORDER[i+1]);
        lineEl.className = 'flow-line ' + (nextDone ? `done ${cls}` : 'pending');
      }
    }
  });
}

function refreshQuestionContent() {
  const s = currentScenarios[currentScenarioIdx];
  const cls = mode==='nvc'?'nvc':'violent';
  const elem = s[currentStepKey];
  const optKey = '_opts_'+s.id+'_'+currentStepKey;
  if (!s[optKey]) s[optKey] = shuffle(elem.opts.map((o,i)=>({...o,origIdx:i})));
  const shuffledOpts = s[optKey];
  const letters = ['🐣','🐥','🐔','🦄'];
  const curAns = getAnswer(s.id, currentStepKey);

  // Update element label
  const elLabel = document.getElementById('elLabel');
  if (elLabel) {
    elLabel.textContent = ELEMENT_NAMES[currentStepKey];
    elLabel.className = 'element-label ' + cls;
  }
  // Update question box
  const qBox = document.getElementById('qBox');
  if (qBox) {
    qBox.textContent = elem.q;
    qBox.className = 'question-box ' + cls;
  }
  // Update options
  const optList = document.getElementById('optList');
  if (optList) {
    let h = '';
    shuffledOpts.forEach((opt, i) => {
      const isSel = curAns && curAns.optionIdx === i;
      h += `<button class="opt-btn${isSel?' selected':''}" onclick="selectAnswer('${currentStepKey}',${i})" id="opt-${i}">
        <span class="opt-letter">${letters[i]}</span><span>${opt.t}</span></button>`;
    });
    optList.innerHTML = h;
  }
  // Update flow diagram
  updateFlowDiagram(s.id, currentStepKey);
}

function updateNavButtons(sid) {
  const btnNext = document.getElementById('btnNext');
  const scenarioDone = allStepsDone(sid);
  if (btnNext) {
    btnNext.disabled = !scenarioDone;
    btnNext.textContent = currentScenarioIdx === currentScenarios.length - 1 ? '🎉 揭晓结果' : '下一场景 ▶';
  }
  const btnPrev = document.getElementById('btnPrev');
  if (btnPrev) btnPrev.disabled = (currentScenarioIdx === 0);
}

function toggleBreakdown() {

  }
}

function revealResult() {
  // Hide the reveal button with a fade
  const btnWrap = document.getElementById('revealBtnWrap');
  if (btnWrap) {
    btnWrap.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    btnWrap.style.opacity = '0';
    btnWrap.style.transform = 'scale(0.9)';
  }
  // Show the hidden content with staggered animation
  setTimeout(() => {
    if (btnWrap) btnWrap.style.display = 'none';
    const hidden = document.getElementById('revealHidden');
    if (hidden) {
      hidden.classList.remove('reveal-hidden');
      // Stagger each child with reveal-anim
      const children = hidden.children;
      for (let i = 0; i < children.length; i++) {
        children[i].classList.add('reveal-anim', 'd' + Math.min(i + 3, 5));
      }
    }
    // Check for confetti
    const score = totalScore();
    if ((mode === 'nvc' && score >= 30) || (mode === 'violent' && score >= 30)) {
      setTimeout(() => { launchConfetti(); }, 400);
    }
  }, 300);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
  ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

// CONFETTI

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#ff8fab','#ffb3ba','#ffdac1','#b5ead7','#c7ceea','#a2d2ff','#fdfd96','#ff9aa2','#e2f0cb','#d5aaff'];
  const particles = [];
  for (let i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 10 + 5,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 3 + 2,
      rot: Math.random() * 360,
      rv: (Math.random() - 0.5) * 10
    });
  }

  let frame = 0;
  function animate() {
    if (frame > 180) { canvas.style.display = 'none'; return; }
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rv;
      p.vy += 0.03;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    requestAnimationFrame(animate);
  }
  animate();
}
