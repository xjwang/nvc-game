<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非暴力沟通大挑战 🎮</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #ff8fab;
    --coral: #ffb3ba;
    --peach: #ffdac1;
    --mint: #b5ead7;
    --lavender: #c7ceea;
    --sky: #a2d2ff;
    --yellow: #fdfd96;
    --nvc-green: #7ec8a0;
    --nvc-dark: #4a7868;
    --violent-red: #e8738a;
    --violent-dark: #5c2d3a;
    --card-bg: rgba(255,255,255,0.92);
    --shadow: 0 8px 32px rgba(0,0,0,0.06);
    --text: #4a4458;
    --text-light: #7a7288;
  }

  body {
    font-family: 'Nunito', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    transition: background 0.6s ease;
    line-height: 1.65;
    overflow-x: hidden;
  }
  body.home-bg {
    background: linear-gradient(135deg, #fce4ec 0%, #f8e8f0 25%, #e8f0f8 50%, #f0f8e8 75%, #fff8e8 100%);
  }
  body.game-nvc {
    background: linear-gradient(135deg, #e8f8e8, #d8f0d8, #e0f0e0, #e8f4e0);
  }
  body.game-violent {
    background: linear-gradient(135deg, #2a1a22, #1a1016, #20141c, #2a1822);
  }

  .container { max-width: 640px; width: 100%; min-height: 500px; }

  /* ===== Floating decorations ===== */
  .float-deco {
    position: fixed; pointer-events: none; z-index: 0;
    font-size: 2rem; opacity: 0.1;
  }

  /* ===== Cards ===== */
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 36px 30px 30px;
    box-shadow: var(--shadow);
    border: 2px solid rgba(200,180,200,0.1);
    position: relative;
    z-index: 1;
  }

  /* Category selection chips */
  .cat-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin: 16px 0;
  }
  .cat-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border-radius: 24px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    border: 2.5px solid #ddd0e0;
    background: #faf8fc;
    color: var(--text);
    transition: all 0.2s;
    user-select: none;
    font-family: inherit;
  }
  .cat-chip:hover {
    border-color: var(--nvc-green);
    background: #f0faf4;
  }
  .cat-chip.selected {
    border-color: var(--nvc-green);
    background: var(--mint);
    color: var(--nvc-dark);
  }
  .cat-chip input { display: none; }
  .cat-start-btn {
    margin-top: 8px;
    padding: 14px 48px;
    border-radius: 32px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    border: none;
    font-family: inherit;
    background: linear-gradient(135deg, var(--nvc-green), var(--nvc-dark));
    color: white;
    box-shadow: 0 6px 28px rgba(126,200,160,0.35);
    transition: all 0.3s;
  }
  .cat-start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(126,200,160,0.5);
  }
  .cat-start-btn:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none !important;
  }
  .cat-count {
    font-size: 0.78rem;
    color: var(--text-light);
    margin-top: 6px;
  }

  /* Ad placeholders */
  .ad-banner {
    width: 100%;
    min-height: 90px;
    margin: 16px auto 0;
    background: rgba(200,180,200,0.08);
    border-radius: 16px;
    border: 1.5px dashed rgba(200,180,200,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--text-light);
    text-align: center;
    padding: 8px;
    max-width: 480px;
  }
  .ad-interstitial-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.55);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .ad-interstitial-box {
    background: white;
    border-radius: 24px;
    padding: 30px 24px 20px;
    width: 90%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 12px 48px rgba(0,0,0,0.2);
  }
  .ad-interstitial-box .ad-placeholder {
    width: 100%;
    min-height: 200px;
    background: rgba(200,180,200,0.08);
    border-radius: 16px;
    border: 1.5px dashed rgba(200,180,200,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    color: var(--text-light);
    margin: 12px 0;
  }
  .ad-close-btn {
    padding: 8px 28px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: #f0e8f0;
    color: var(--text);
    font-family: inherit;
    transition: background 0.2s;
  }
  .ad-close-btn:hover { background: #e0d4e2; }

  /* ===== LEVEL SELECT ===== */
  .level-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    z-index: 998;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
  }
  .level-box {
    background: white;
    border-radius: 28px;
    padding: 36px 28px 28px;
    width: 92%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 16px 60px rgba(0,0,0,0.18);
    animation: popIn 0.35s cubic-bezier(0.16,1,0.3,1);
  }
  .level-emoji { font-size: 3.2rem; margin-bottom: 4px; }
  .level-title { font-size: 1.35rem; font-weight: 900; color: var(--text); margin-bottom: 4px; }
  .level-sub { font-size: 0.82rem; color: var(--text-light); margin-bottom: 18px; line-height: 1.5; }
  .level-btn {
    display: block; width: 100%;
    padding: 14px 18px; margin-bottom: 10px;
    border-radius: 18px; font-size: 0.92rem; font-weight: 700;
    cursor: pointer; border: 2.5px solid #e8dce8;
    background: #faf8fc; color: var(--text);
    font-family: inherit; transition: all 0.25s;
    text-align: left;
  }
  .level-btn:hover {
    border-color: var(--nvc-green);
    background: #f0faf4;
    transform: translateX(4px);
  }
  .level-btn .lbl { font-size: 0.72rem; font-weight: 600; color: var(--text-light); display: block; margin-top: 2px; }

  /* ===== LEARNING CARDS ===== */
  .learn-card {
    background: white;
    border-radius: 28px;
    padding: 32px 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.06);
    width: 100%; max-width: 640px;
    margin: 0 auto;
    position: relative;
    animation: popIn 0.35s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.92) translateY(12px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .learn-progress {
    display: flex; gap: 6px; justify-content: center; margin-bottom: 16px;
  }
  .learn-progress span {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ddd0e0; transition: all 0.3s;
  }
  .learn-progress span.active { background: var(--nvc-green); transform: scale(1.4); }
  .learn-progress span.done { background: var(--nvc-green); opacity: 0.5; }
  .learn-emoji { font-size: 3rem; text-align: center; margin-bottom: 6px; }
  .learn-h1 {
    font-size: 1.35rem; font-weight: 900; color: var(--text);
    text-align: center; margin-bottom: 4px;
  }
  .learn-h2 {
    font-size: 0.82rem; font-weight: 600; color: var(--nvc-green);
    text-align: center; margin-bottom: 12px;
  }
  .learn-body {
    font-size: 0.9rem; line-height: 1.7; color: var(--text);
    margin-bottom: 8px;
  }
  .learn-body strong { color: var(--nvc-dark); }
  .learn-example {
    background: #f5faf5; border-radius: 16px; padding: 14px 16px;
    margin: 10px 0; border-left: 4px solid var(--nvc-green);
  }
  .learn-example.good { border-left-color: var(--nvc-green); background: #f0faf4; }
  .learn-example.bad { border-left-color: var(--violent-red); background: #fdf0f2; }
  .learn-example .ex-label { font-weight: 700; font-size: 0.78rem; margin-bottom: 4px; }
  .learn-example.good .ex-label { color: var(--nvc-dark); }
  .learn-example.bad .ex-label { color: var(--violent-dark); }
  .learn-example .ex-text { font-size: 0.85rem; line-height: 1.55; }
  .learn-quote {
    background: #f8f4fc; border-radius: 16px; padding: 14px 16px; margin: 10px 0;
    font-size: 0.85rem; font-style: italic; line-height: 1.55;
    color: #6a5a7a; border-left: 4px solid var(--lavender);
  }
  .learn-quote .q-author { font-style: normal; font-weight: 700; font-size: 0.78rem; margin-top: 4px; color: var(--text-light); }
  .learn-stat {
    display: flex; gap: 10px; justify-content: center; margin: 10px 0; flex-wrap: wrap;
  }
  .learn-stat-item {
    background: #f8f4fc; border-radius: 16px; padding: 12px 14px;
    text-align: center; flex: 1; min-width: 100px;
  }
  .learn-stat-num { font-size: 1.4rem; font-weight: 900; color: var(--nvc-dark); }
  .learn-stat-lbl { font-size: 0.7rem; color: var(--text-light); font-weight: 600; }
  .learn-btns {
    display: flex; gap: 10px; justify-content: center; margin-top: 18px;
  }
  .learn-btn {
    padding: 12px 28px; border-radius: 24px; font-size: 0.88rem;
    font-weight: 800; cursor: pointer; border: none;
    font-family: inherit; transition: all 0.25s;
  }
  .learn-btn.primary {
    background: linear-gradient(135deg, var(--nvc-green), var(--nvc-dark));
    color: white; box-shadow: 0 4px 20px rgba(126,200,160,0.3);
  }
  .learn-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(126,200,160,0.45); }
  .learn-btn.secondary {
    background: #f0e8f0; color: var(--text);
  }
  .learn-btn.secondary:hover { background: #e0d4e2; }

  /* ===== HOME PAGE ===== */
  .home-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .home-mascot {
    font-size: 4.5rem;
    display: inline-block;
    animation: bounce 2s ease infinite;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    20% { transform: translateY(-18px); }
    40% { transform: translateY(0); }
    60% { transform: translateY(-8px); }
    80% { transform: translateY(0); }
  }
  .home-title {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, #ff8fab, #a2d2ff, #b5ead7, #fdfd96);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rainbowText 4s ease infinite;
    margin: 8px 0;
  }
  @keyframes rainbowText {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .home-sub {
    font-size: 0.92rem;
    color: var(--text-light);
    line-height: 1.7;
  }
  .mode-btns {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .mode-btn {
    padding: 18px 20px;
    border-radius: 20px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: inherit;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .mode-btn .btn-emoji { font-size: 2rem; display: block; margin-bottom: 4px; }
  .mode-btn .btn-tag { font-size: 0.78rem; font-weight: 600; opacity: 0.75; margin-top: 4px; display: block; }
  .mode-btn.nvc {
    background: linear-gradient(135deg, #e0f8e0, #c8f0d0);
    color: var(--nvc-dark);
    border-color: var(--nvc-green);
  }
  .mode-btn.nvc:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 12px 40px rgba(120,180,140,0.3);
    animation: wiggle 0.4s ease;
  }
  .mode-btn.violent {
    background: linear-gradient(135deg, #4a2d3a, #5c3a48);
    color: #f0d8e0;
    border-color: var(--violent-red);
  }
  .mode-btn.violent:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 12px 40px rgba(220,100,130,0.4);
    animation: wiggle 0.4s ease;
  }
  @keyframes wiggle {
    0%,100% { transform: translateY(-4px) scale(1.02) rotate(0); }
    25% { transform: translateY(-4px) scale(1.02) rotate(-1.5deg); }
    75% { transform: translateY(-4px) scale(1.02) rotate(1.5deg); }
  }

  /* ===== GAME PAGE ===== */
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .mode-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    border-radius: 30px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    animation: pulse 2s ease infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  .mode-chip.nvc { background: #d8f0d8; color: var(--nvc-dark); }
  .mode-chip.violent { background: #5c2d3a; color: #f0c8d8; }
  .score-badge {
    font-size: 0.9rem;
    font-weight: 700;
  }
  .score-badge .score-num {
    font-size: 1.3rem;
    display: inline-block;
    animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes popIn {
    from { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.2); }
    to { transform: scale(1); opacity: 1; }
  }
  .score-badge.nvc .score-num { color: var(--nvc-green); }
  .score-badge.violent .score-num { color: var(--violent-red); }

  /* Hearts progress */
  .hearts-progress {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    justify-content: center;
  }
  .heart-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
  }
  .heart-dot.done.nvc { background: var(--nvc-green); color: white; animation: popIn 0.4s ease; }
  .heart-dot.done.violent { background: var(--violent-red); color: white; animation: popIn 0.4s ease; }
  .heart-dot.current.nvc { background: var(--nvc-green); color: white; transform: scale(1.2); box-shadow: 0 0 12px rgba(120,200,150,0.5); animation: pulse 1s ease infinite; }
  .heart-dot.current.violent { background: var(--violent-red); color: white; transform: scale(1.2); box-shadow: 0 0 12px rgba(220,100,130,0.5); animation: pulse 1s ease infinite; }
  .heart-dot.pending { background: #e8e0e8; }
  .game-violent .heart-dot.pending { background: #3a2835; }

  .scenario-chip {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 0.72rem;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .scenario-chip.nvc { background: #fef0d8; color: #9a7a50; }
  .scenario-chip.violent { background: #4a2d3a; color: #e0b0c0; }

  /* Scenario description */
  .scenario-desc {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.9;
    padding: 18px 22px;
    margin: 10px 0 6px;
    border-radius: 16px;
  }
  .scenario-desc.nvc { background: #fcfaf4; border-left: 4px solid var(--nvc-green); }
  .scenario-desc.violent { background: #2a1a24; border-left: 4px solid var(--violent-red); color: #d8c8d0; }
  .scenario-emotion-hint {
    font-size: 0.85rem;
    color: #9a8a78;
    font-style: italic;
    margin-bottom: 8px;
  }
  .game-violent .scenario-emotion-hint { color: #b098a0; }

  /* Flow diagram */
  .flow-diagram {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin: 14px 0 22px;
    flex-wrap: wrap;
  }
  .flow-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 64px;
  }
  .flow-dot {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 800;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }
  .flow-dot.done { color: white; }
  .flow-dot.done.nvc { background: var(--nvc-green); }
  .flow-dot.done.violent { background: var(--violent-red); }
  .flow-dot.active {
    color: white; transform: scale(1.18);
    box-shadow: 0 0 0 6px rgba(120,200,150,0.18);
    animation: flowPulse 1.4s ease infinite;
  }
  .flow-dot.active.nvc { background: var(--nvc-green); box-shadow: 0 0 0 6px rgba(120,200,150,0.18); }
  .flow-dot.active.violent { background: var(--violent-red); box-shadow: 0 0 0 6px rgba(220,100,130,0.18); }
  @keyframes flowPulse {
    0%,100% { box-shadow: 0 0 0 6px rgba(120,200,150,0.18); }
    50% { box-shadow: 0 0 0 14px rgba(120,200,150,0.05); }
  }
  .flow-dot.pending { background: #e8e0e8; color: #b8b0b8; }
  .game-violent .flow-dot.pending { background: #3a2835; color: #7a6878; }
  .flow-line {
    width: 36px; height: 3px;
    border-radius: 2px;
    transition: all 0.4s ease;
    flex-shrink: 0;
  }
  .flow-line.done.nvc { background: var(--nvc-green); }
  .flow-line.done.violent { background: var(--violent-red); }
  .flow-line.pending { background: #e0d8e0; }
  .game-violent .flow-line.pending { background: #3a2835; }
  .flow-label {
    font-size: 0.7rem; font-weight: 700; opacity: 0.6; letter-spacing: 0.04em;
    transition: all 0.3s;
  }
  .flow-node.active-node .flow-label { opacity: 1; }

  /* Share */
  .share-row {
    display: flex; justify-content: center; margin: 6px 0 14px;
  }
  .btn-share {
    padding: 10px 28px; border-radius: 30px;
    font-size: 0.88rem; font-weight: 800; cursor: pointer;
    border: 2.5px dashed #d0c0d0;
    background: #faf8fc;
    color: #8a7a90;
    transition: all 0.3s; font-family: inherit;
  }
  .btn-share:hover {
    border-color: #b090c0; color: #6a5080;
    transform: translateY(-2px); box-shadow: 0 4px 16px rgba(150,120,180,0.15);
  }
  #shareCanvas { display: none; }

  /* Smooth question transition */
  .question-area {
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .question-area.switching {
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
  }

  /* Navigation buttons */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    gap: 10px;
  }
  .btn-nav {
    padding: 8px 18px;
    border-radius: 22px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .btn-nav.prev {
    background: #f0e8f0;
    color: #6a5a7a;
  }
  .btn-nav.prev:hover { background: #e0d4e2; transform: translateX(-2px); }
  .btn-nav.next {
    background: var(--nvc-green);
    color: white;
  }
  .btn-nav.next:hover { background: var(--nvc-dark); transform: translateX(2px); }
  .btn-nav:disabled {
    opacity: 0.3;
    cursor: default;
    transform: none !important;
  }
  .game-violent .btn-nav.prev {
    background: #3a2835;
    color: #c8b8c8;
  }
  .game-violent .btn-nav.next {
    background: var(--violent-red);
  }
  .nav-scene-indicator {
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--text);
    white-space: nowrap;
  }
  .game-violent .nav-scene-indicator { color: #d8c8d0; }

  /* Result reveal */
  .reveal-hidden { display: none; }
  .btn-reveal {
    padding: 14px 42px;
    border-radius: 32px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    border: none;

// ============================================================
// GAME STATE
// ============================================================
let mode = null;           // 'nvc' | 'violent'
let currentScenarios = []; // 3 randomly selected scenarios
let currentScenarioIdx = 0; // 0,1,2 — which scenario page
let currentStepKey = 'observe'; // 'observe'|'feel'|'need'|'request' — which step is active
let autoAdvanceTimer = null; // cancelable auto-advance to next scenario
// answers: keyed by "scenarioId-elementKey" — { scenarioId, elementKey, optionIdx, score }
let answers = {};
let selectedCategories = []; // populated by homepage category chips

// Step data
const ELEMENT_ORDER = ['observe','feel','need','request'];
const ELEMENT_NAMES = {observe:'观察', feel:'感受', need:'需要', request:'请求'};
const ELEMENT_ICONS = {observe:'👁️', feel:'💗', need:'🎯', request:'🤝'};

const CATEGORIES = [
  { tag:'闺蜜关系', label:'👭 闺蜜朋友' },
  { tag:'爱人关系', label:'💑 爱人伴侣' },
  { tag:'家庭关系', label:'👨‍👩‍👧 家庭父母' },
  { tag:'亲子关系', label:'🧒 亲子教育' },
  { tag:'职场关系', label:'💼 职场沟通' },
];

// ============================================================
// PERSISTENCE — localStorage for daily challenge & achievements
// ============================================================
const STORAGE_KEY = 'nvc_game_data';
const LEVEL_KEY = 'nvc_level'; // 'expert'|'advanced'|'average'|'beginner'|null

function loadStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) { /* ignore corrupt data */ }
  return { dailyDate: null, lastPlayDate: null, streak: 0, achievements: [], playedTags: [], totalGames: 0, bestScore: 0 };
}

function saveStorage(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ============================================================
// HELPERS
// ============================================================
function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function getScore(base) { return mode==='nvc'?base:3-base; }
function totalScore() { return Object.values(answers).reduce((s,a)=>s+(a.score||0),0); }
function answerKey(sid, ek) { return sid+'-'+ek; }
function getAnswer(sid, ek) { return answers[answerKey(sid,ek)]; }
function isStepDone(sid, ek) { return !!getAnswer(sid,ek); }
function allStepsDone(sid) { return ELEMENT_ORDER.every(k=>isStepDone(sid,k)); }
function elemScores() {
  const map = {observe:0,feel:0,need:0,request:0};
  Object.values(answers).forEach(a=>{if(map[a.elementKey]!==undefined)map[a.elementKey]+=a.score||0;});
  return map;
}

// ============================================================
// GAME SETUP
// ============================================================
function startGame(m, selectedTags) {
  mode = m;
  answers = {};
  currentScenarioIdx = 0;
  currentStepKey = 'observe';
  if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
  const pool = selectedTags && selectedTags.length > 0
    ? scenarioPool.filter(s => selectedTags.includes(s.tag))
    : scenarioPool;
  currentScenarios = shuffle(pool).slice(0,3);
  const bgClass = mode==='nvc'?'game-nvc':'game-violent';
  document.getElementById('body').className = bgClass;
  document.getElementById('app').className = mode==='violent'?'game-violent':'';
  renderScenarioPage();
}

// ============================================================
// RENDER SCENARIO PAGE (flow diagram + current question)
// ============================================================
function renderScenarioPage() {
  if (currentScenarioIdx >= currentScenarios.length) { renderResult(); return; }

  const s = currentScenarios[currentScenarioIdx];
  const cls = mode==='nvc'?'nvc':'violent';
  const score = totalScore();
  const maxScore = currentScenarios.length * ELEMENT_ORDER.length * 3;

  // Flow diagram — each dot/line gets an id for smooth DOM updates
  let flowHTML = '<div class="flow-diagram">';
  ELEMENT_ORDER.forEach((key, i) => {
    const done = isStepDone(s.id, key);
    const active = key === currentStepKey;
    let dotCls = done ? `done ${cls}` : (active ? `active ${cls}` : 'pending');
    let lineCls = '';
    if (i < 3) {
      const nextDone = isStepDone(s.id, ELEMENT_ORDER[i+1]);
      lineCls = nextDone ? `done ${cls}` : 'pending';
    }
    const nodeCls = active ? 'flow-node active-node' : 'flow-node';
    flowHTML += `<div class="${nodeCls}" id="flow-node-${key}">
      <div class="flow-dot ${dotCls}" id="flow-dot-${key}">${done?'✓':ELEMENT_ICONS[key]}</div>
      <span class="flow-label" id="flow-label-${key}">${ELEMENT_NAMES[key]}</span>
    </div>`;
    if (i < 3) flowHTML += `<div class="flow-line ${lineCls}" id="flow-line-${i}"></div>`;
  });
  flowHTML += '</div>';

  // Current question
  const elem = s[currentStepKey];
  const shuffledOpts = (function(){
    const key = '_opts_'+s.id+'_'+currentStepKey;
    if (!s[key]) s[key] = shuffle(elem.opts.map((o,i)=>({...o,origIdx:i})));
    return s[key];
  })();

  const letters = ['🐣','🐥','🐔','🦄'];
  let optsHTML = '';
  const curAns = getAnswer(s.id, currentStepKey);
  shuffledOpts.forEach((opt, i) => {
    const isSel = curAns && curAns.optionIdx === i;
    optsHTML += `<button class="opt-btn${isSel?' selected':''}" onclick="selectAnswer('${currentStepKey}',${i})" id="opt-${i}">
      <span class="opt-letter">${letters[i]}</span><span>${opt.t}</span></button>`;
  });

  // All steps done for this scenario?
  const scenarioDone = allStepsDone(s.id);

  const lastScenario = currentScenarioIdx === currentScenarios.length - 1;

  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="game-header">
        <span class="mode-chip ${cls}">${mode==='nvc'?'🌿 非暴力沟通挑战':'🔥 暴力沟通大挑战'}</span>
        <span class="score-badge ${cls}">得分 <span class="score-num" id="liveScore">${score}</span></span>
      </div>
      <span class="scenario-chip ${cls}">${s.tag} · 场景 ${currentScenarioIdx+1}/3</span>
      <div style="font-size:1.2rem;font-weight:800;color:var(--text);margin:4px 0;">${s.title}</div>
      <div class="scenario-desc ${cls}">${s.text||s.title}</div>
      ${s.emotion ? `<div class="scenario-emotion-hint">${s.emotion}</div>` : ''}
      ${flowHTML}
      <div id="qArea" class="question-area">
        <div class="element-label ${cls}" id="elLabel">${ELEMENT_NAMES[currentStepKey]}</div>
        <div class="question-box ${cls}" id="qBox">${elem.q}</div>
        <div class="options-list" id="optList">${optsHTML}</div>
      </div>
      <div class="nav-row">
        <button class="btn-nav prev" id="btnPrev" ${currentScenarioIdx===0?'disabled':''} onclick="prevScenario()">◀ 上一场景</button>
        <span class="nav-scene-indicator">${currentScenarioIdx+1} / ${currentScenarios.length}</span>
        <button class="btn-nav next" id="btnNext" ${!scenarioDone?'disabled':''} onclick="nextScenario()">${lastScenario?'🎉 揭晓结果':'下一场景 ▶'}</button>
      </div>
      <div style="text-align:center;margin-top:12px;">
        <button class="btn btn-quit" onclick="renderHome()">🏠 退出</button>
      </div>
    </div>`;
}

function selectAnswer(stepKey, optIdx) {
  const s = currentScenarios[currentScenarioIdx];
  const optsKey = '_opts_'+s.id+'_'+stepKey;
  const shuffledOpts = s[optsKey];
  const baseScore = shuffledOpts[optIdx].s;
  const finalScore = getScore(baseScore);

  answers[answerKey(s.id, stepKey)] = {
    scenarioId: s.id, elementKey: stepKey,
    optionIdx: optIdx, score: finalScore, baseScore
  };

  // Update option styling in-place (no full re-render)
  shuffledOpts.forEach((_,i)=>{
    const el = document.getElementById('opt-'+i);
    if(el) el.classList.toggle('selected', i===optIdx);
  });

  // Animate live score
  const sEl = document.getElementById('liveScore');
  if(sEl){sEl.textContent=totalScore();sEl.style.animation='none';sEl.offsetHeight;sEl.style.animation='popIn 0.3s cubic-bezier(0.16,1,0.3,1)';}

  // Update flow diagram immediately (dot turns green/red)
  updateFlowDiagram(s.id, stepKey);

  const curIdx = ELEMENT_ORDER.indexOf(stepKey);
  if (curIdx < 3) {
    // Advance to next step within same scenario — smooth fade transition
    currentStepKey = ELEMENT_ORDER[curIdx + 1];
    const qArea = document.getElementById('qArea');
    if (qArea) {
      qArea.classList.add('switching');
      setTimeout(() => {
        refreshQuestionContent();
        qArea.classList.remove('switching');
      }, 200);
    } else {
      renderScenarioPage();
    }
  } else {
    // Last step (request) done → enable nav, auto-advance or wait for click
    updateNavButtons(s.id);
    if (currentScenarioIdx < currentScenarios.length - 1) {
      if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
      autoAdvanceTimer = setTimeout(() => { autoAdvanceTimer = null; nextScenario(); }, 650);
    }
  }
}

function prevScenario() {
  if (currentScenarioIdx <= 0) return;
  if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
  currentScenarioIdx--;
  currentStepKey = 'observe';
  renderScenarioPage();
  window.scrollTo({top:0, behavior:'smooth'});
}

function nextScenario() {
  if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
  currentScenarioIdx++;
  currentStepKey = 'observe';
  if (currentScenarioIdx >= currentScenarios.length) renderResult();
  else { renderScenarioPage(); window.scrollTo({top:0,behavior:'smooth'}); }
}

function updateFlowDiagram(sid, activeKey) {
  const cls = mode==='nvc'?'nvc':'violent';
  ELEMENT_ORDER.forEach((key, i) => {
    const done = isStepDone(sid, key);
    const active = key === activeKey;
    const dotEl = document.getElementById('flow-dot-'+key);
    const nodeEl = document.getElementById('flow-node-'+key);
    if (dotEl) {
      dotEl.className = 'flow-dot ' + (done ? `done ${cls}` : (active ? `active ${cls}` : 'pending'));
      dotEl.textContent = done ? '✓' : ELEMENT_ICONS[key];
    }
    if (nodeEl) {
      nodeEl.className = active ? 'flow-node active-node' : 'flow-node';
    }
    if (i < 3) {
      const lineEl = document.getElementById('flow-line-'+i);
      if (lineEl) {
        const nextDone = isStepDone(sid, ELEMENT_ORDER[i+1]);
        lineEl.className = 'flow-line ' + (nextDone ? `done ${cls}` : 'pending');
      }
    }
  });
}

function refreshQuestionContent() {
  const s = currentScenarios[currentScenarioIdx];
  const cls = mode==='nvc'?'nvc':'violent';
  const elem = s[currentStepKey];
  const optKey = '_opts_'+s.id+'_'+currentStepKey;
  if (!s[optKey]) s[optKey] = shuffle(elem.opts.map((o,i)=>({...o,origIdx:i})));
  const shuffledOpts = s[optKey];
  const letters = ['🐣','🐥','🐔','🦄'];
  const curAns = getAnswer(s.id, currentStepKey);

  // Update element label
  const elLabel = document.getElementById('elLabel');
  if (elLabel) {
    elLabel.textContent = ELEMENT_NAMES[currentStepKey];
    elLabel.className = 'element-label ' + cls;
  }
  // Update question box
  const qBox = document.getElementById('qBox');
  if (qBox) {
    qBox.textContent = elem.q;
    qBox.className = 'question-box ' + cls;
  }
  // Update options
  const optList = document.getElementById('optList');
  if (optList) {
    let h = '';
    shuffledOpts.forEach((opt, i) => {
      const isSel = curAns && curAns.optionIdx === i;
      h += `<button class="opt-btn${isSel?' selected':''}" onclick="selectAnswer('${currentStepKey}',${i})" id="opt-${i}">
        <span class="opt-letter">${letters[i]}</span><span>${opt.t}</span></button>`;
    });
    optList.innerHTML = h;
  }
  // Update flow diagram
  updateFlowDiagram(s.id, currentStepKey);
}

function updateNavButtons(sid) {
  const btnNext = document.getElementById('btnNext');
  const scenarioDone = allStepsDone(sid);
  if (btnNext) {
    btnNext.disabled = !scenarioDone;
    btnNext.textContent = currentScenarioIdx === currentScenarios.length - 1 ? '🎉 揭晓结果' : '下一场景 ▶';
  }
  const btnPrev = document.getElementById('btnPrev');
  if (btnPrev) btnPrev.disabled = (currentScenarioIdx === 0);
}

// ============================================================
// RESULT PAGE
// ============================================================
function renderResult() {
  const score = totalScore();
  const maxScore = currentScenarios.length * ELEMENT_ORDER.length * 3;
  const cls = mode === 'nvc' ? 'nvc' : 'violent';
  // Update storage (daily, streak, achievements)
  const storage = loadStorage();
  const today = new Date().toISOString().slice(0,10);
  storage.totalGames = (storage.totalGames || 0) + 1;
  if (storage.bestScore === undefined || score > storage.bestScore) {
    storage.bestScore = score;
  }
  if (storage.dailyDate !== today) {
    storage.dailyDate = today;
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    storage.streak = (storage.lastPlayDate === yesterday) ? (storage.streak || 0) + 1 : 1;
    storage.lastPlayDate = today;
  }
  if (!storage.achievements) storage.achievements = [];
  if (score >= 30 && !storage.achievements.includes('master')) {
    storage.achievements.push('master');
  }
  if (storage.streak >= 7 && !storage.achievements.includes('streak7')) {
    storage.achievements.push('streak7');
  }
  const playedTags = storage.playedTags || [];
  currentScenarios.forEach(s => {
    if (!playedTags.includes(s.tag)) playedTags.push(s.tag);
  });
  storage.playedTags = playedTags;
  const allTags = CATEGORIES.map(c => c.tag);
  const hasAll = allTags.every(t => playedTags.includes(t));
  if (hasAll && !storage.achievements.includes('all_categories')) {
    storage.achievements.push('all_categories');
  }
  saveStorage(storage);
  const cClass = (s) => mode === 'nvc' ? 'nvc-c' : 'v-c';

  // Evaluation data
  let icon, title, nickname, msg;
  if (mode === 'nvc') {
    if (score >= 30) {
      icon='🌈'; title='NVC 神仙'; nickname='绰号：和平使者 · 沟通界白月光';
      msg='天呐！你是不是偷偷把《非暴力沟通》全书背下来了？你在每个场景中都精准地选择了最温柔也最有效的表达方式。你身边的人一定觉得跟你说话很舒服——继续保持，你就是朋友圈里的沟通天花板。';

function toggleBreakdown() {

function revealResult() {
  // Hide the reveal button with a fade
  const btnWrap = document.getElementById('revealBtnWrap');
  if (btnWrap) {
    btnWrap.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    btnWrap.style.opacity = '0';
    btnWrap.style.transform = 'scale(0.9)';
  }
  // Show the hidden content with staggered animation
  setTimeout(() => {
    if (btnWrap) btnWrap.style.display = 'none';
    const hidden = document.getElementById('revealHidden');
    if (hidden) {
      hidden.classList.remove('reveal-hidden');
      // Stagger each child with reveal-anim
      const children = hidden.children;
      for (let i = 0; i < children.length; i++) {
        children[i].classList.add('reveal-anim', 'd' + Math.min(i + 3, 5));
      }
    }
    // Check for confetti
    const score = totalScore();
    if ((mode === 'nvc' && score >= 30) || (mode === 'violent' && score >= 30)) {
      setTimeout(() => { launchConfetti(); }, 400);
    }
  }, 300);
}

function shareResult() {

    bgGrad.addColorStop(0, '#f0faf0'); bgGrad.addColorStop(0.5, '#e8f4e8'); bgGrad.addColorStop(1, '#f4f8f0');
  } else {
    bgGrad.addColorStop(0, '#3a2430'); bgGrad.addColorStop(0.5, '#2a1822'); bgGrad.addColorStop(1, '#3a2030');
  }
  ctx.fillStyle = bgGrad;
  roundRect(ctx, 0, 0, w, h, 28);

  // Header
  ctx.fillStyle = isNVC ? '#4a7868' : '#e0b0c0';

  // Title
  ctx.fillStyle = isNVC ? '#3d3a4e' : '#e0d0d8';
  ctx.font = 'bold 30px Nunito, "PingFang SC", sans-serif';
  ctx.fillText(getResultTitle(), w/2, 175);

  // Nickname
  ctx.fillStyle = isNVC ? '#7a7288' : '#b098a8';
  ctx.font = '16px Nunito, "PingFang SC", sans-serif';
  ctx.fillText(getResultNickname(), w/2, 205);

  // Score
  ctx.fillStyle = isNVC ? '#7ec8a0' : '#e8738a';
  ctx.font = 'bold 64px Nunito, sans-serif';
  ctx.fillText(score, w/2, 275);
  ctx.fillStyle = isNVC ? '#7a7288' : '#b098a8';
  ctx.font = '16px Nunito, "PingFang SC", sans-serif';
  ctx.fillText('总分 / ' + maxScore + ' 分', w/2, 300);

  // Breakdown boxes
  const es = elemScores();
  const boxW = 90, boxH = 72, startX = 42, gap = 16, boxY = 330;
  ELEMENT_ORDER.forEach((key, i) => {
    const x = startX + i * (boxW + gap);
    ctx.fillStyle = isNVC ? '#f4faf4' : '#3a2835';
    roundRect(ctx, x, boxY, boxW, boxH, 14);
    ctx.fill();
    ctx.fillStyle = isNVC ? '#7ec8a0' : '#e8738a';
    ctx.font = 'bold 14px Nunito, "PingFang SC", sans-serif';
    ctx.fillText(ELEMENT_NAMES[key], x + boxW/2, boxY + 28);
    ctx.fillStyle = isNVC ? '#3d3a4e' : '#e0d0d8';
    ctx.font = 'bold 22px Nunito, sans-serif';
    ctx.fillText((es[key]||0)+' / 3', x + boxW/2, boxY + 54);
  });

  // Footer
  ctx.fillStyle = isNVC ? '#b0a8b8' : '#8a7888';
  ctx.font = '13px Nunito, "PingFang SC", sans-serif';
  ctx.fillText('非暴力沟通大挑战 · NVC Game', w/2, boxY + boxH + 40);
  ctx.fillText('观察 → 感受 → 需要 → 请求', w/2, boxY + boxH + 62);
  ctx.fillText('日期：' + new Date().toLocaleDateString('zh-CN'), w/2, boxY + boxH + 84);

  // Download
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.download = 'NVC挑战结果_' + new Date().toISOString().slice(0,10) + '.png';
    a.href = url; a.click();
    URL.revokeObjectURL(url);
  });
  canvas.style.display = 'none';
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
  ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#ff8fab','#ffb3ba','#ffdac1','#b5ead7','#c7ceea','#a2d2ff','#fdfd96','#ff9aa2','#e2f0cb','#d5aaff'];
  const particles = [];
  for (let i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 10 + 5,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 3 + 2,
      rot: Math.random() * 360,
      rv: (Math.random() - 0.5) * 10
    });
  }

  let frame = 0;
  function animate() {
    if (frame > 180) { canvas.style.display = 'none'; return; }
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rv;
      p.vy += 0.03;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    requestAnimationFrame(animate);
  }
  animate();
}

          🌟 我对NVC比较熟悉
          <span class="lbl">读过相关书籍或文章，了解基本概念</span>
        </button>
        <button class="level-btn" onclick="setLevel('average')">
          🌱 我大概了解NVC
          <span class="lbl">听过这个概念，知道大概意思但不深入</span>
        </button>
        <button class="level-btn" onclick="setLevel('beginner')">
          🐣 我第一次听说NVC
          <span class="lbl">完全不了解，想先学习再体验游戏</span>
        </button>
      </div>
    </div>`;
}

function setLevel(level) {
  localStorage.setItem(LEVEL_KEY, level);
  const overlay = document.getElementById('levelOverlay');
  if (overlay) { overlay.style.transition = 'opacity 0.3s'; overlay.style.opacity = '0'; }
  setTimeout(() => {
    if (level === 'expert' || level === 'advanced') {
      renderHome();
    } else {
      renderLearningCards(0);
    }
  }, 300);
}

function renderLearningCards(cardIdx) {
  document.getElementById('body').className = 'home-bg';
  document.getElementById('app').className = '';

  const cards = [
    {
      emoji:'🌿', h1:'什么是非暴力沟通？',
      h2:'Nonviolent Communication · NVC',
      body:`<p class="learn-body">
        <strong>非暴力沟通 (NVC)</strong> 是由美国心理学家 <strong>马歇尔·卢森堡</strong>（Marshall Rosenberg）博士在 1960 年代提出的一种沟通方式。它被联合国教科文组织列为全球非暴力解决冲突的 <strong>最佳实践之一</strong>。
      </p>
      <p class="learn-body">
        NVC 的核心思想其实很简单：<strong>人与人之间的冲突，本质上是因为需要没有被满足</strong>，而不是因为哪一方是「坏人」。当我们停止指责、评判对方，转而表达自己的 <strong>观察、感受、需要和请求</strong> 时，沟通的墙就会变成桥。
      </p>
      <div class="learn-quote">
        「当我们专注于澄清彼此的观察、感受、需要和请求——而不是诊断或评判——我们就能在内心深处发现连自己都未曾意识到的慈悲。」
        <div class="q-author">—— 马歇尔·卢森堡《非暴力沟通》</div>
      </div>
      <div class="learn-stat">
        <div class="learn-stat-item">
          <div class="learn-stat-num">60+</div>
          <div class="learn-stat-lbl">国家在实践</div>
        </div>
        <div class="learn-stat-item">
          <div class="learn-stat-num">100万+</div>
          <div class="learn-stat-lbl">全球学习者</div>
        </div>
        <div class="learn-stat-item">
          <div class="learn-stat-num">87%</div>
          <div class="learn-stat-lbl">关系改善率</div>
        </div>
      </div>
      <p class="learn-body" style="margin-top:4px;">
        NVC 被广泛应用于 <strong>家庭教育、亲密关系、职场沟通、冲突调解、心理咨询</strong> 等领域，甚至被用于国际和平谈判。它不是让你变得「软弱」，而是让你在坚持自己立场的同时，<strong>仍然与对方保持连接</strong>。
      </p>`
    },
    {
      emoji:'👁️', h1:'第一步：观察',
      h2:'Observe — 不带评判地描述事实',
      body:`<p class="learn-body">
        NVC 的第一步是 <strong>「观察」</strong>——像摄像机一样记录发生了什么，不加任何评判、贴标签或夸大。<strong>这是最难的一步</strong>，因为我们太习惯一开口就下结论了。
      </p>
      <p class="learn-body">
        关键区别在于：<strong>观察是「事实」</strong>，评判是「我认为的事实」。当你用「每次」「总是」「从来不」这些词时，你已经从观察滑向了评判。
      </p>
      <div class="learn-example good">
        <div class="ex-label">✅ NVC 观察</div>
        <div class="ex-text">「这周你有三天晚上 10 点后才回家，没有提前跟我说。」</div>
      </div>
      <div class="learn-example bad">
        <div class="ex-label">❌ 评判</div>
        <div class="ex-text">「你最近总是很晚才回来，心里还有这个家吗？」</div>
      </div>
      <p class="learn-body">
        观察是沟通的 <strong>地基</strong>——地基歪了，后面说的再多都是 disputes。好消息是：观察是可以练习的，你只需要问自己一句「<strong>我真的看到了什么？</strong>」
      </p>`
    },
    {
      emoji:'💗', h1:'第二步：感受',
      h2:'Feel — 说出真实的情绪，而非想法',
      body:`<p class="learn-body">
        第二步是表达你的 <strong>感受</strong>。注意：感受是说 <strong>你内心的情绪</strong>（开心、难过、焦虑、温暖），而不是你对对方的 <strong>想法或评判</strong>。
      </p>
      <p class="learn-body">
        我们经常用「我觉得你……」开头，以为在表达感受，其实是在 <strong>指责对方</strong>。「我觉得你不在乎我」——这是想法，不是感受。真正的感受是 <strong>「我感到孤独」</strong>。
      </p>
      <div class="learn-example good">
        <div class="ex-label">✅ NVC 感受</div>
        <div class="ex-text">「我一个人等了一个小时，感到有些失落和担心。」</div>
      </div>
      <div class="learn-example bad">
        <div class="ex-label">❌ 想法 / 指责</div>
        <div class="ex-text">「我觉得你根本不把我的时间当回事。」</div>
      </div>
      <p class="learn-body">
        心理学研究发现，大多数人能准确识别的情绪只有 <strong>3-5 种</strong>（开心、难过、生气、害怕），但实际上人类有上百种情绪。扩大你的 <strong>情绪词汇库</strong>，本身就是提升沟通能力的捷径：
      </p>
      <p class="learn-body" style="text-align:center;font-size:0.85rem;color:var(--text-light);">
        温暖 · 安心 · 感动 · 期待 · 失落 · 沮丧 · 疲惫 · 焦虑 · 受伤 · 孤单
      </p>`
    },
    {
      emoji:'🎯', h1:'第三步：需要',
      h2:'Need — 找到情绪背后的深层需求',
      body:`<p class="learn-body">
        <strong>所有的感受背后都有一个需要。</strong> 这是 NVC 最核心的洞见。你感到生气，可能是因为你需要 <strong>被尊重</strong>；你感到焦虑，可能是因为你需要 <strong>安全感</strong>；你感到孤独，可能是因为你需要 <strong>连接</strong>。
      </p>
      <p class="learn-body">
        我们习惯在冲突中说「你让我很生气」——把责任推给对方。NVC 的转变是：<strong>「我感到生气，因为我需要被尊重。」</strong> 这个小小的句式变化，把力量从对方手中拿回了自己手里。
      </p>
      <div class="learn-example good">
        <div class="ex-label">✅ NVC 需要</div>
        <div class="ex-text">「我感到着急，因为我很在意我们的约定，需要被认真对待。」</div>
      </div>
      <div class="learn-example bad">
        <div class="ex-label">❌ 指责</div>
        <div class="ex-text">「你总是说话不算话，太让人失望了。」</div>
      </div>
      <div class="learn-quote">
        「人类共通的需要其实并不多——理解、尊重、安全、归属、自主、意义。NVC 让我们看到：<strong>我们不是在对抗彼此，而是在各自争取未被满足的需要。</strong>」
      </div>
      <p class="learn-body" style="text-align:center;font-size:0.85rem;color:var(--text-light);">
        被看见 · 被倾听 · 被尊重 · 安全感 · 信任 · 自主 · 连接 · 理解
      </p>`
    },
    {
      emoji:'🤝', h1:'第四步：请求',
      h2:'Request — 提出具体可行的行动',
      body:`<p class="learn-body">
        最后一步是提出 <strong>请求</strong>——明确告诉对方，你希望接下来怎么做。<strong>关键区别：请求 ≠ 要求</strong>。请求允许对方说「不」，而要求背后藏着惩罚。
      </p>
      <p class="learn-body">
        一个好的 NVC 请求有三个特点：<strong>具体的、可行的、用肯定句</strong>。「你能不能靠谱一点？」——这不是请求，是抱怨。「下次如果会晚到，可以提前给我发个消息吗？」——这才是请求。
      </p>
      <div class="learn-example good">
        <div class="ex-label">✅ NVC 请求</div>
        <div class="ex-text">「下次如果有变动，可以提前半天告诉我的手机发个消息吗？这样我可以重新安排时间。」</div>
      </div>
      <div class="learn-example bad">
        <div class="ex-label">❌ 要求 / 命令</div>
        <div class="ex-text">「你下次再迟到就别来了。」</div>
      </div>
      <p class="learn-body">
        NVC 的请求还有一个温柔的底层逻辑：<strong>即使对方说「不」，你们的关系也没有断裂</strong>。你可以继续探索——「那什么样的安排对你来说可行？」——在对话中找到双方都满意的方案。这才是真正的 <strong>合作式沟通</strong>。
      </p>`
    },
    {
      emoji:'🔄', h1:'完整流程 · 一个例子走通 NVC',
      h2:'观察 → 感受 → 需要 → 请求',
      body:`<p class="learn-body">
        现在我们把四步串起来，看一个 <strong>完整的 NVC 对话</strong>。场景：伴侣又忘了关客厅的灯。
      </p>
      <div class="learn-example good" style="border-left-color:var(--nvc-green);">
        <div class="ex-label" style="color:var(--nvc-dark);">🌿 NVC 方式</div>
        <div class="ex-text">
          <strong>👁️ 观察：</strong>「亲爱的，这周有三天我看到客厅灯开着，我们都睡了还没关。」<br>
          <strong>💗 感受：</strong>「我有点担心电费，也会有些小小的失落。」<br>
          <strong>🎯 需要：</strong>「因为我需要我们一起维护好这个家，也珍惜我们共同的资源。」<br>
          <strong>🤝 请求：</strong>「下次睡前可以顺手关一下客厅灯吗？或者如果太累叫一声，我来关也行。」
        </div>
      </div>
      <div class="learn-example bad">
        <div class="ex-label">🔥 平时我们可能会说</div>
        <div class="ex-text">「你怎么又忘了关灯？跟你说了多少遍了？电费不要钱啊？你总是这样马马虎虎的！」</div>
      </div>
      <p class="learn-body">
        感受到区别了吗？第一种方式对方 <strong>不会防御</strong>，因为里面没有攻击。第二种方式一开口就点燃了战火——对方要么反击，要么冷战。而你们争论的 <strong>核心其实是同一件事</strong>：希望这个家更好。
      </p>
      <div class="learn-quote">
        NVC 不是让你压抑情绪，而是让你在情绪中仍然能 <strong>清晰地表达自己，温柔地连接他人</strong>。这不是软弱——这是最高级的沟通力量。
      </div>
      <p class="learn-body" style="text-align:center;font-weight:700;color:var(--nvc-dark);">
        准备好了吗？现在去游戏中亲自实践吧！🌿
      </p>`
    }
  ];

  const card = cards[cardIdx];
  const total = cards.length;

  document.getElementById('app').innerHTML = `
    <div class="learn-card">
      <div class="learn-progress">
        ${cards.map((_, i) =>
          `<span class="${i === cardIdx ? 'active' : (i < cardIdx ? 'done' : '')}"></span>`
        ).join('')}
      </div>
      <div class="learn-emoji">${card.emoji}</div>
      <div class="learn-h1">${card.h1}</div>
      <div class="learn-h2">${card.h2}</div>
      ${card.body}
      <div class="learn-btns">
        ${cardIdx > 0
          ? `<button class="learn-btn secondary" onclick="renderLearningCards(${cardIdx-1})">← 上一页</button>`
          : ''}
        ${cardIdx < total - 1
          ? `<button class="learn-btn primary" onclick="renderLearningCards(${cardIdx+1})">下一页 →</button>`
          : `<button class="learn-btn primary" onclick="renderHome()">🎮 开始游戏！</button>`}
      </div>
    </div>`;
}

renderLevelSelect();
</script>
